spring.application.name=aigroove

# ---------------------------------------------------------------------------
# 이 파일은 템플릿입니다.
# 복사해서 application.properties 를 만들고 실제 값을 채워 넣으세요.
#   cp application-example.properties application.properties
# application.properties 는 .gitignore 에 등록되어 커밋되지 않습니다.
# ---------------------------------------------------------------------------

# Database
spring.datasource.url=jdbc:mariadb://localhost:3306/admin_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# JWT
# 최소 64바이트 이상의 랜덤 문자열을 사용하세요.
# 생성 예: openssl rand -hex 64
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail (Gmail SMTP)
# spring.mail.password 는 Google 계정 앱 비밀번호를 사용합니다.
# https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.packagesToScan=com.game4men.aigroove.game.controller, com.game4men.aigroove.admin.controller
springdoc.swagger-ui.tagsSorter=alpha
springdoc.pathsToMatch=/game/**

# MVC
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

