spring.application.name=aigroove


# Database
spring.datasource.url=jdbc:mariadb://localhost:3306/aigroove
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update


# JWT
# 최소 64바이트 이상의 랜덤 문자열을 사용한다.
#   생성 예: openssl rand -hex 64
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
# MAIL_APP_PASSWORD 는 Google 계정 앱 비밀번호다 (계정 비밀번호가 아니다).
#   https://myaccount.google.com/apppasswords
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.packagesToScan=com.game4men.aigroove.game.controller, com.game4men.aigroove.admin.controller
springdoc.swagger-ui.tagsSorter=alpha
# 컨트롤러 실제 경로가 /api/game/** 이므로 여기도 맞춰야 한다.
# /game/** 로 두면 매칭되는 엔드포인트가 없어 "No operations defined in spec!" 이 뜬다.
springdoc.pathsToMatch=/api/game/**

# MVC
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# 리버스 프록시(nginx) 뒤에서 X-Forwarded-* 헤더를 신뢰한다.
# 없으면 HTTPS 요청을 http로 인식해 same-origin 요청이 CORS 403으로 막힌다.
server.forward-headers-strategy=native

