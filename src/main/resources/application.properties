#Swagger 설정
# Swagger UI 경로 지정
springdoc.swagger-ui.path=/swagger-ui.html
# API 문서 경로 설정
springdoc.api-docs.path=/api-docs
# 패키지 스캔 범위 지정
springdoc.packagesToScan=com.game4men.aigroove.game.controller
# 태그 정렬 방식
springdoc.swagger-ui.tagsSorter=alpha
# 기본적으로 문서화할 API 패턴 설정
springdoc.pathsToMatch=/api/game/**