spring.application.name=aigroove
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/aigroove?serverTimezone\=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=none으로 수정. 
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
# 정적 리소스 위치 설정
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/

# 정적 리소스 캐싱 설정 (선택사항)
spring.web.resources.cache.period=3600

# 정적 리소스 경로 패턴 설정 (기본값은 /**)
spring.mvc.static-path-pattern=/**

# 요청당 최대 파일 크기
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

